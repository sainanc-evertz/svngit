<svg xmlns="http://www.w3.org/2000/svg" width="638" height="196" viewBox="0 0 638 196" role="img" aria-label="patch text is LF; the file is CRLF">
<rect width="638" height="196" rx="8" fill="#1e1e2e"/>
<path d="M0 30 V8 a8 8 0 0 1 8 -8 H630 a8 8 0 0 1 8 8 V30 Z" fill="#181825"/>
<circle cx="18" cy="15" r="5" fill="#f38ba8"/>
<circle cx="36" cy="15" r="5" fill="#f9e2af"/>
<circle cx="54" cy="15" r="5" fill="#a6e3a1"/>
<text x="319" y="19.5" font-family="'SF Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="11.5" fill="#9399b2" text-anchor="middle">patch text is LF; the file is CRLF</text>
<g font-family="'SF Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="13.5">
<text x="18.0" y="40.0" xml:space="preserve"><tspan fill="#a6e3a1">$ </tspan><tspan fill="#cdd6f4">git add -e</tspan></text>
<text x="18.0" y="60.0" xml:space="preserve" fill="#cdd6f4">fatal: hunk #1 of crlf.c does not apply.</text>
<text x="18.0" y="80.0" xml:space="preserve" fill="#cdd6f4">The file uses CRLF line endings and the patch uses LF, so no context line</text>
<text x="18.0" y="100.0" xml:space="preserve" fill="#cdd6f4">  can match. svngit reads patches as LF; convert the file with `dos2unix`,</text>
<text x="18.0" y="120.0" xml:space="preserve" fill="#cdd6f4">  or use `git add -p`, which works on the file directly and keeps CRLF</text>
<text x="18.0" y="140.0" xml:space="preserve" fill="#cdd6f4">  intact.</text>
<text x="18.0" y="160.0" xml:space="preserve" fill="#cdd6f4">Nothing was staged.</text>
</g></svg>

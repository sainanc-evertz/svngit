[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "svngit"
version = "0.1.0"
description = "Run git commands against a Subversion repository"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["subversion", "svn", "git", "vcs", "version-control", "migration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Version Control",
  "Topic :: Utilities",
]
# Deliberately none: svngit is standard library only, so a distro package or
# a zipapp needs nothing beyond Python itself and the `svn` client.
dependencies = []

[project.urls]
Homepage = "https://github.com/sainanc-evertz/svngit"
Source = "https://github.com/sainanc-evertz/svngit"
Issues = "https://github.com/sainanc-evertz/svngit/issues"
Documentation = "https://github.com/sainanc-evertz/svngit/blob/master/docs/COMMANDS.md"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
svngit = "svngit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The `git` shim ships inside the package so that one PATH line works for
# every install route. Wheels do not preserve the executable bit, which is
# why shim_directory() restores it on first use.
"svngit.shim" = ["git", "git.cmd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["needs_svn: requires a real svn/svnadmin on PATH"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "svngit"
version = "0.1.0"
description = "Run git commands against a Subversion repository"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["subversion", "svn", "git", "vcs", "migration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
svngit = "svngit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["needs_svn: requires a real svn/svnadmin on PATH"]
